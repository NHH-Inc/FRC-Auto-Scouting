<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Tengen mark">
  <title>Tengen mark</title>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f2f6fa"/>
      <stop offset="0.5" stop-color="#c3ced9"/>
      <stop offset="1"   stop-color="#8fa0b3"/>
    </linearGradient>
    <linearGradient id="steelDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#9aa9bb"/>
      <stop offset="1"   stop-color="#6b7d92"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="72" fill="#16233a"/>
  <g transform="translate(200 200) scale(1.12)">

    <!-- Hexagon, flat-top, vertices on exact 60-degree steps at r=150. -->
    <polygon points="75,-129.9 -75,-129.9 -150,0 -75,129.9 75,129.9 150,0"
             fill="none" stroke="url(#steel)" stroke-width="9" stroke-linejoin="miter"/>

    <!-- Inner ring: a reference circle, thin, so the star has something to sit against. -->
    <circle r="96" fill="none" stroke="url(#steelDim)" stroke-width="2.5" opacity="0.55"/>
    <circle r="62" fill="none" stroke="url(#steelDim)" stroke-width="1.5" opacity="0.35"/>

    <!-- Eight-point star. Cardinals long, diagonals short, every point a clean isoceles kite. -->
    <g fill="url(#steel)">
      <!-- N / S / E / W -->
      <polygon points="0,-138 14,-30 0,0 -14,-30"/>
      <polygon points="0,138  14,30  0,0  -14,30"/>
      <polygon points="138,0  30,14  0,0  30,-14"/>
      <polygon points="-138,0 -30,14 0,0 -30,-14"/>
    </g>
    <g fill="url(#steelDim)">
      <!-- NE / SE / SW / NW at exactly 45 degrees, 0.52 of the cardinal reach -->
      <polygon points="50.9,-50.9 12,-19 0,0 -19,12"/>
      <polygon points="50.9,50.9  19,12  0,0  -12,19"/>
      <polygon points="-50.9,50.9 -12,19 0,0 19,-12"/>
      <polygon points="-50.9,-50.9 -19,-12 0,0 12,-19"/>
    </g>

    <!-- The centre point the name refers to. -->
    <circle r="15" fill="#16233a" stroke="url(#steel)" stroke-width="6"/>

    <!-- Two nodes on the vertical axis, echoing the original's dumbbell. -->
    <circle cx="0" cy="-150" r="16" fill="#16233a" stroke="url(#steel)" stroke-width="8"/>
    <circle cx="0" cy="150"  r="16" fill="#16233a" stroke="url(#steel)" stroke-width="8"/>
  </g>
</svg>
